name: weekly-lighthouse
on:
  schedule:
    - cron: '0 11 * * 1'   # Mondays, 11:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Lighthouse
        run: |
          npx -y @lhci/cli@0.14.x autorun --config=lighthouserc-mobile.json
          npx -y @lhci/cli@0.14.x autorun --config=lighthouserc-desktop.json

      - name: Append results to CSV
        run: |
          [ -f results.csv ] || echo "date,url,strategy,score,lcp_ms,tbt_ms,cls,ttfb_ms" > results.csv
          for s in mobile desktop; do
            for f in $(jq -r '.[] | select(.isRepresentativeRun) | .jsonPath' lhci-$s/manifest.json); do
              jq -r --arg s "$s" '[.fetchTime, .finalUrl, $s,
                (.categories.performance.score*100|round),
                (.audits["largest-contentful-paint"].numericValue|round),
                (.audits["total-blocking-time"].numericValue|round),
                (.audits["cumulative-layout-shift"].numericValue*1000|round/1000),
                (.audits["server-response-time"].numericValue|round)] | @csv' \
                "lhci-$s/$(basename "$f")" >> results.csv
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            lhci-mobile
            lhci-desktop

      - name: Commit CSV
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add results.csv
          git commit -m "weekly lighthouse results" || exit 0
          git push
