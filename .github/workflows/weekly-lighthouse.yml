name: lighthouse
on:
  schedule:
    - cron: '17 11 * * 1'   # Monday: homepages
    - cron: '17 11 * * 2'   # Tuesday: all other pages
  workflow_dispatch:
    inputs:
      list:
        description: Which URL list to run
        type: choice
        options: [homepages, pages]
        default: homepages
permissions:
  contents: write
concurrency:
  group: lighthouse
  cancel-in-progress: false
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pick URL list
        run: |
          case "${{ github.event.schedule }}" in
            "17 11 * * 1") LIST=homepages ;;
            "17 11 * * 2") LIST=pages ;;
            *) LIST="${{ inputs.list }}" ;;
          esac
          echo "LIST=$LIST" >> "$GITHUB_ENV"
          echo "Running urls-$LIST.txt"

      - name: Run Lighthouse (one URL at a time, tolerate failures)
        run: |
          mapfile -t URLS < <(tr -d '\r' < "urls-$LIST.txt" | grep -v '^[[:space:]]*$')
          for s in mobile desktop; do
            rm -rf .lighthouseci
            for url in "${URLS[@]}"; do
              npx -y @lhci/cli@0.14.x collect --config=lighthouserc-$s.json --url="$url" --additive \
                || echo "::warning::Lighthouse failed for $url ($s)"
            done
            npx -y @lhci/cli@0.14.x upload --config=lighthouserc-$s.json \
              || echo "::warning::No results to upload for $s"
          done

      - name: Append results to CSV (skip missing data)
        run: |
          [ -f results.csv ] || echo "date,url,strategy,score,lcp_ms,tbt_ms,cls,ttfb_ms" > results.csv
          for s in mobile desktop; do
            [ -f lhci-$s/manifest.json ] || { echo "::warning::no $s results found"; continue; }
            for f in $(jq -r '.[] | select(.isRepresentativeRun) | .jsonPath' lhci-$s/manifest.json); do
              jq -r --arg s "$s" '
                def r: if . == null then "" else round end;
                [.fetchTime, .requestedUrl, $s,
                 ((.categories.performance.score) | if . == null then "" else (. * 100 | round) end),
                 (.audits["largest-contentful-paint"].numericValue | r),
                 (.audits["total-blocking-time"].numericValue | r),
                 (.audits["cumulative-layout-shift"].numericValue | if . == null then "" else ((. * 1000 | round) / 1000) end),
                 (.audits["server-response-time"].numericValue | r)] | @csv' \
                "lhci-$s/$(basename "$f")" >> results.csv \
                || echo "::warning::could not read $f"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ env.LIST }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            lhci-mobile
            lhci-desktop

      - name: Commit CSV
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add results.csv
          git commit -m "lighthouse results ($LIST)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
